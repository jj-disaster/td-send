<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Send</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--muted:#6f6f6f;--dim:#3a3a3a}
*{box-sizing:border-box;margin:0;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:32px 24px}
main{width:100%;max-width:520px}
h1{font-size:12px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
form{display:flex;gap:12px}
input{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-radius:0;padding:15px 14px;font:inherit;caret-color:var(--fg)}
input::placeholder{color:var(--dim)}
input:focus{outline:1px solid var(--fg);outline-offset:3px}
button{background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:0;padding:15px 18px;font:inherit;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
button:disabled{background:var(--bg);color:var(--dim);border-color:var(--dim);cursor:not-allowed}
button:not(:disabled):active{background:var(--bg);color:var(--fg)}
#pill{margin-top:16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#pill.up{color:var(--fg)}
#log{margin-top:40px;padding-top:16px;border-top:1px solid var(--dim);list-style:none;font-size:13px;color:var(--muted)}
#log li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0}
#log b{font-weight:400;color:var(--fg)}
</style>
</head>
<body>
<main>
<h1>send to stage</h1>
<form id="f" autocomplete="off">
<input id="v" placeholder="type anything, or a number" inputmode="text" enterkeyhint="send" maxlength="120" required>
<button id="send" type="submit">send</button>
</form>
<p id="pill"><span id="txt">connecting</span></p>
<ul id="log"></ul>
</main>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const tunnel = q.get('wss');
  const https = location.protocol === 'https:';
  const scheme = tunnel || https ? 'wss' : 'ws';
  const host = tunnel || q.get('h') || location.hostname || '127.0.0.1';
  const port = q.get('p') || (tunnel || https ? '443' : '9001');
  const clamp = parseFloat(q.get('min') || '-1000');
  const clampMax = parseFloat(q.get('max') || '1000');
  const rate = parseFloat(q.get('rate') || '8');
  const burst = parseInt(q.get('burst') || '3', 10);
  const uid = Math.random().toString(36).slice(2, 7);

  const pill = document.getElementById('pill');
  const txt = document.getElementById('txt');
  const log = document.getElementById('log');
  const field = document.getElementById('v');
  const btn = document.getElementById('send');

  let ws, queue = [], tries = 0, tokens = burst, last = 0;

  const show = (kind, value) => {
    const li = document.createElement('li');
    const tag = document.createElement('b');
    tag.textContent = kind;
    li.append(tag, document.createTextNode(' ' + value));
    log.prepend(li);
    while (log.children.length > 3) log.lastChild.remove();
  };

  const label = (kind, value) => {
    if (kind === 'num') {
      const n = Math.min(clampMax, Math.max(clamp, parseFloat(value)));
      return 'num\t' + (Number.isFinite(n) ? n : 0);
    }
    return 'txt\t' + String(value).replace(/[\t\r\n]+/g, ' ').slice(0, 120);
  };

  function connect() {
    try { ws = new WebSocket(scheme + '://' + host + ':' + port); }
    catch (e) { retry(); return; }
    ws.onopen = () => {
      tries = 0;
      pill.classList.add('up');
      txt.textContent = 'live';
      btn.disabled = false;
      const pending = queue;
      queue = [];
      pending.forEach(write);
    };
    ws.onclose = retry;
    ws.onerror = () => ws.close();
  }

  function retry() {
    pill.classList.remove('up');
    btn.disabled = true;
    txt.textContent = https && !tunnel ? 'blocked: needs a wss tunnel' : 'reconnecting';
    const wait = Math.min(5000, 250 * Math.pow(2, tries++));
    setTimeout(connect, wait);
  }

  function write(line) {
    if (ws.readyState === 1) ws.send(line + '\t' + uid);
    else if (queue.length < 16) queue.push(line);
  }

  function send(raw) {
    const now = performance.now();
    tokens = Math.min(burst, tokens + ((now - last) / 1000) * rate);
    last = now;
    if (tokens < 1) return;
    tokens -= 1;
    const t = raw.trim();
    if (!t) return;
    const n = Number(t);
    const isNum = /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t) && Number.isFinite(n);
    const line = label(isNum ? 'num' : 'txt', t);
    write(line);
    show(isNum ? 'num' : 'txt', isNum ? Number(n).toFixed(3).replace(/\.?0+$/, '') || '0' : t);
  }

  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    send(field.value);
    field.value = '';
    field.focus();
  });

  btn.disabled = true;
  connect();
})();
</script>
</body>
</html>
